<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastBite Admin</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:white}
.header{background:black;color:orange;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.preview{padding:15px}
.card{background:#222;padding:15px;border-radius:12px;margin:10px 0}
.food-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #333}
.food-row img{width:50px;height:50px;border-radius:8px;margin-right:10px}
.fleft{display:flex;align-items:center}
.fab{position:fixed;right:20px;bottom:20px;background:orange;color:white;width:60px;height:60px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:30px;cursor:pointer;box-shadow:0 0 15px rgba(255,165,0,.5)}
.panel{position:fixed;right:-100%;top:0;width:85%;height:100%;background:#1c1c1c;transition:.3s;padding:20px;box-sizing:border-box;overflow:auto}
.panel.show{right:0}
button{background:orange;color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
input{width:100%;padding:10px;margin:8px 0;border:none;border-radius:8px}
</style>
</head>
<body>
<div class="header" id="siteTitle">FastBite Admin</div><div class="preview">
  <div class="card">
    <h2>🍔 Current Foods</h2>
    <div id="foodList"></div>
  </div>
  <div class="card">
    <h2>🏪 Restaurants</h2>
    <div id="restaurantList"></div>
  </div>
</div><div class="fab" onclick="togglePanel()">⚙️</div><div class="panel" id="panel">
  <h2>Customize</h2>
  <h3>Website Name</h3>
  <input id="siteName" placeholder="FastBite">
  <button onclick="saveName()">Save Name</button>  <h3>Theme Color</h3>
  <input id="themeColor" type="color" value="#ffa500">
  <button onclick="saveTheme()">Save Theme</button>  <h3>Add Food</h3>
  <input id="foodName" placeholder="Food name">
  <input id="foodPrice" placeholder="Price">
  <input id="foodImage" placeholder="Image URL">
  <button onclick="addFood()">Add Food</button>
</div><script>
let foods = JSON.parse(localStorage.getItem('foods')) || [
{name:'Pizza',price:199,img:'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=200',res:'Dominos'},
{name:'Burger',price:149,img:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200',res:'McDonalds'}
];

function togglePanel(){document.getElementById('panel').classList.toggle('show');}

function renderFoods(){
 let html=''; let rests=new Set();
 foods.forEach((f,i)=>{rests.add(f.res||'Unknown'); html += `<div class='food-row'><div class='fleft'><img src='${f.img}'><div>${f.name}<br>₹${f.price}</div></div><button onclick='deleteFood(${i})'>Delete</button></div>`});
 document.getElementById('foodList').innerHTML=html;
 document.getElementById('restaurantList').innerHTML=[...rests].map(r=>`<div class='food-row'>${r}</div>`).join('');
 localStorage.setItem('foods', JSON.stringify(foods));
}

function addFood(){
 foods.push({name:foodName.value,price:foodPrice.value,img:foodImage.value,res:'Custom'});
 foodName.value=''; foodPrice.value=''; foodImage.value='';
 renderFoods();
}
function deleteFood(i){foods.splice(i,1); renderFoods();}
function saveName(){let n=siteName.value||'FastBite'; localStorage.setItem('siteName',n); document.getElementById('siteTitle').innerText=n+' Admin';}
function saveTheme(){let c=themeColor.value; localStorage.setItem('themeColor',c); document.querySelector('.fab').style.background=c; document.querySelectorAll('button').forEach(b=>b.style.background=c); document.querySelector('.header').style.color=c;}

document.getElementById('siteTitle').innerText=(localStorage.getItem('siteName')||'FastBite')+' Admin';
renderFoods();
saveTheme();
</script></body>
</html>
