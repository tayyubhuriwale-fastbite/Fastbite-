<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Order Page</title>

<style>

*{box-sizing:border-box;}
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

.header{
padding:15px;
background:#000;
display:flex;
justify-content:space-between;
align-items:center;
color:orange;
position:sticky;
top:0;
z-index:100;
box-shadow:0 2px 10px rgba(255,122,0,0.2);
}

.container{padding:15px;}

.searchBox input{
width:100%;padding:13px;border:none;border-radius:14px;background:#1c1c1c;color:white;
}

.item{
display:flex;background:#1c1c1c;margin:12px 0;padding:12px;border-radius:18px;align-items:center;border:1px solid rgba(255,122,0,0.2);
}

.item img{width:75px;height:75px;border-radius:15px;margin-right:12px;object-fit:cover;}

.box{
background:#1c1c1c;padding:16px;border-radius:18px;margin:18px 0;border:1px solid rgba(255,122,0,0.15);
}

input,textarea{
width:100%;padding:13px;border-radius:12px;border:none;margin-top:10px;background:#2a2a2a;color:white;
}

button{
width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(45deg,#ff7a00,#ff9f43);color:white;font-weight:bold;
}

.total{color:orange;font-size:20px;font-weight:bold;}

.payOption{display:flex;align-items:center;gap:10px;background:#2a2a2a;padding:12px;border-radius:12px;margin:10px 0;}

.trackBar{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}

.step{color:#666;}
.active{color:orange;}

#orderTimer{
font-size:20px;
font-weight:bold;
color:orange;
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
<div onclick="goBack()">⬅</div>
<div>🛒 Confirm Order</div>
<div onclick="openHistory()">📜</div>
</div>

<div class="container">

<div class="searchBox">
<input placeholder="Search items">
</div>

<div id="items"></div>

<!-- MY ORDER -->
<div class="box">
<h3>📦 My Order</h3>
<div id="orderTimer">Waiting for order...</div>

<div>
<div class="step" id="s1">✅ Placed</div>
<div class="step" id="s2">👨‍🍳 Preparing</div>
<div class="step" id="s3">🚴 Rider</div>
<div class="step" id="s4">🎉 Delivered</div>
</div>
</div>

<div class="box">
<h3>📍 Delivery</h3>
<input id="address" placeholder="Address">
<input id="phone" placeholder="Phone">
</div>

<div class="box">
<h3>💳 Payment</h3>
<label class="payOption"><input type="radio" name="payment" value="COD">COD</label>
<label class="payOption"><input type="radio" name="payment" value="UPI">UPI</label>
</div>

<div class="box">
<h3>💰 Bill</h3>
<div id="itemTotal"></div>
<div id="finalTotal"></div>
</div>

<button onclick="placeOrder()">Place Order</button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let discount=0;

function showItems(){
let total=0;
cart.forEach(i=>total+=i.price);
document.getElementById("itemTotal").innerText="Items: ₹"+total;
document.getElementById("finalTotal").innerText="Total: ₹"+total;
}

function placeOrder(){

let address=document.getElementById("address").value;
let phone=document.getElementById("phone").value;
let payment=document.querySelector('input[name="payment"]:checked')?.value;

if(!address||!phone||!payment)return alert("Fill all");

alert("Order Placed 🚀");

startOrderTimer();

}

/* TIMER SYSTEM */

let totalTime=600;
let current=totalTime;
let started=false;

function startOrderTimer(){
if(started)return;
started=true;

let t=setInterval(()=>{

let m=Math.floor(current/60);
let s=current%60;

document.getElementById("orderTimer").innerText=
"Arriving in: "+m+":"+(s<10?"0":"")+s;

current--;

if(current==590){
document.getElementById("s2").classList.add("active");
}

if(current==300){
document.getElementById("s3").classList.add("active");
}

if(current==0){
clearInterval(t);
document.getElementById("s4").classList.add("active");
document.getElementById("orderTimer").innerText="Delivered 🎉";
}

},1000);
}

function goBack(){history.back();}
function openHistory(){alert("History");}

showItems();

</script>

</body>
</html>
